events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Конфігурація для API Gateway
    server {
        listen 80;

        # Налаштування CORS, щоб фронтенд міг робити запити
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

        # Обробка попередніх запитів (Preflight OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Маршрутизація для Сервісу Авторизації
        location /api/auth/ {
            proxy_pass http://auth-service:5001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Маршрутизація для Ігрового Сервісу
        location /api/games/ {
            proxy_pass http://games-service:5002/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}