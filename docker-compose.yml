version: '3.8'

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - games-service

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: casino_admin
      POSTGRES_PASSWORD: casino_password
      POSTGRES_DB: casino_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://casino_admin:casino_password@postgres:5432/casino_db
      - JWT_SECRET=supersecretjwtkey_casino_2025
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  games-service:
    build: ./games-service
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://casino_admin:casino_password@postgres:5432/casino_db
      - JWT_SECRET=supersecretjwtkey_casino_2025
      - AUTH_SERVICE_URL=http://auth-service:5001
    ports:
      - "5002:5002"
    depends_on:
      - postgres
      - auth-service

volumes:
  pgdata:
