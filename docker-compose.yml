services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - games-service

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casino_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-casino_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-casino_admin}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-casino_db}
      - JWT_SECRET=${JWT_SECRET:-dev_only_insecure_secret_change_me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SEED_DEFAULT_ADMIN=${SEED_DEFAULT_ADMIN:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  games-service:
    build: ./games-service
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-casino_admin}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-casino_db}
      - JWT_SECRET=${JWT_SECRET:-dev_only_insecure_secret_change_me}
      - AUTH_SERVICE_URL=http://auth-service:5001
    ports:
      - "5002:5002"
    depends_on:
      - postgres
      - auth-service

volumes:
  pgdata:
